<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Let's Go Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card"><!-- card box around everything, just for styling (style.css) -->
  <h1>Let's go home?</h1>
  <button id="leaveButton" style="display: none">Leave this party</button>


  <div id="startScreen" class="fade-in">

    <button id="createButton">Create party</button>
    <p>or</p>
    <input id="codeInput" placeholder="Party code">
    <button id="joinButton">Join party</button>
    <p id="errorText"></p>
  </div>

  <div id="waitingScreen" class="fade-in" style="display: none;">
    <p>Waiting for another person to join...</p>
    <p>Party code: <b id="codeText"></b></p>
    <p>Send this code to your friend!</p>
  </div>

  <div id="partyScreen" class="fade-in" style="display: none;">
    <p>Click the box when you are ready to leave!</p>
    <label>
      <input type="checkbox" id="readyCheckbox">
      I'm ready to leave
    </label>
  </div>

  <div id="LGHScreen" class="fade-in" style="display: none;">
    <p>I hate it here... Let's go home :(</p>
  </div>
  </div> <!-- end of card box -->
  <!-- load the web-haptics library and put it on window so app.js can use it -->
  <script type="module">
    import { WebHaptics } from "https://cdn.jsdelivr.net/npm/web-haptics@0.0.6/+esm";
    window.haptics = new WebHaptics();
  </script>
  <script src="app.js"></script>
</body>
</html>
